<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Chimney Care Login</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
width:90%;
max-width:400px;
}

h2{
text-align:center;
margin-bottom:20px;
color:#0d1b2a;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#0d1b2a;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h2>Prime Chimney Care</h2>

<input
type="text"
id="name"
placeholder="Enter Your Name"
required
>

<input
type="tel"
id="mobile"
placeholder="Enter Mobile Number"
required
>

<button onclick="loginUser()">
Continue
</button>

</div>

<script>

function loginUser(){

const name =
document.getElementById("name").value.trim();

const mobile =
document.getElementById("mobile").value.trim();

if(name==="" || mobile===""){
alert("Please fill all details");
return;
}

localStorage.setItem("customerName",name);
localStorage.setItem("customerMobile",mobile);
localStorage.setItem("userLoggedIn","true");

window.location.href="services.html";

}

</script>

</body>
</html>
