<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Chimney Care - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.login-card{
background:#fff;
width:100%;
max-width:420px;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#0d1b2a;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
margin-bottom:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#0d1b2a;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.95;
}

#otpSection{
display:none;
margin-top:15px;
}

.message{
margin-top:15px;
text-align:center;
font-size:14px;
font-weight:600;
}

.success{
color:green;
}

.error{
color:red;
}
</style>
</head>

<body>

<div class="login-card">

<div class="logo">
Prime Chimney Care
</div>

<div class="subtitle">
Login securely with Email OTP
</div>

<input
type="email"
id="email"
placeholder="Enter your email address"
>

<button onclick="sendOTP()">
Send OTP
</button>

<div id="otpSection">

<input
type="text"
id="otp"
placeholder="Enter 6 Digit OTP"
>

<button onclick="verifyOTP()">
Verify OTP
</button>

</div>

<div id="msg" class="message"></div>

</div>

<script>

const supabaseUrl =
"https://ivjwuysselffmaipushq.supabase.co";

const supabaseKey =
"sb_publishable_4XTdceyQG0LqW6yxTqQQXg_yH4QYdAB";

const supabase =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);

function showMessage(text,type){
const msg = document.getElementById("msg");
msg.innerHTML = text;
msg.className = "message " + type;
}

async function sendOTP(){

const email =
document.getElementById("email").value.trim();

if(!email){
showMessage("Please enter your email address","error");
return;
}

showMessage("Sending OTP...","success");

const { error } =
await supabase.auth.signInWithOtp({
email: email,
options: {
emailRedirectTo:
"https://prime-chimney-care-vert.vercel.app/"
}
});

if(error){
showMessage(error.message,"error");
return;
}

showMessage(
"OTP sent successfully. Check your email inbox.",
"success"
);

document.getElementById("otpSection").style.display = "block";
}

async function verifyOTP(){

const email =
document.getElementById("email").value.trim();

const otp =
document.getElementById("otp").value.trim();

if(!otp){
showMessage("Please enter OTP","error");
return;
}

const { error } =
await supabase.auth.verifyOtp({
email: email,
token: otp,
type: "email"
});

if(error){
showMessage(error.message,"error");
return;
}

localStorage.setItem(
"userLoggedIn",
"true"
);

window.location.href =
"services.html";

}

</script>

</body>
</html>
