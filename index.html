<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Chimney Care</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#fff;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.loader-container{
text-align:center;
width:100%;
}

.logo{
font-size:28px;
font-weight:700;
color:#111;
margin-bottom:25px;
}

.loading-bar{
width:180px;
height:4px;
background:#e5e5e5;
margin:auto;
border-radius:10px;
overflow:hidden;
}

.loading-progress{
height:100%;
width:0%;
background:#6c3cff;
animation:load 3s linear forwards;
}

@keyframes load{
from{width:0;}
to{width:100%;}
}
</style>
</head>

<body>

<div class="loader-container">
<div class="logo">Prime Chimney Care</div>

<div class="loading-bar">
<div class="loading-progress"></div>
</div>
</div>

<script>
setTimeout(function(){
window.location.href="home.html";
},3000);
</script>

</body>
</html>
