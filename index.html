<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Chimney Care</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#fff;
}

/* Splash Screen */
#splash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#fff;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.splash-content{
text-align:center;
width:100%;
}

.logo{
font-size:22px;
font-weight:700;
color:#111;
margin-bottom:25px;
line-height:1.2;
}

.loader{
width:180px;
height:4px;
background:#e5e5e5;
border-radius:20px;
overflow:hidden;
margin:auto;
}

.loader-bar{
height:100%;
width:0%;
background:#6c4df6;
animation:load 2.5s linear forwards;
}

@keyframes load{
from{width:0%;}
to{width:100%;}
}
/* Home Screen */
#home{
display:none;
padding:30px;
}

.header{
font-size:28px;
font-weight:bold;
color:#07152b;
margin-bottom:20px;
}

.search{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
}

.banner{
margin-top:20px;
background:#001f4d;
color:white;
padding:25px;
border-radius:15px;
}

.banner h2{
margin-bottom:10px;
}

.btn{
display:inline-block;
margin-top:10px;
background:#ff9800;
color:white;
padding:12px 20px;
border-radius:8px;
text-decoration:none;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:12px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}
</style>
</head>

<body>

<!-- Splash -->
<div id="splash">
  <div class="splash-content">

    <div class="logo">
      Prime<br>
      Chimney Care
    </div>

    <div class="loader">
      <div class="loader-bar"></div>
    </div>

  </div>
</div>

<!-- Home -->
<div id="home">

<div class="header">
Prime Chimney Care
</div>

<input class="search"
placeholder="Search Services">

<div class="banner">
<h2>Deep Chimney Cleaning</h2>
<p>Professional Cleaning & Repair Services</p>

<a href="#" class="btn">
Book Now
</a>
</div>

</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
<div>🏠 Home</div>
<div>🛒 Cart</div>
<div>📖 Orders</div>
<div>👤 Account</div>
</div>

<script>

window.onload=function(){

setTimeout(function(){

document.getElementById("splash").style.display="none";
document.getElementById("home").style.display="block";

},2500);

}

</script>

</body>
</html>
